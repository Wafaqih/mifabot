name: Deploy MIFABOT to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      diagnostics:
        description: "Tampilkan status dan log PM2 tanpa melakukan deploy"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mifabot-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure VPS SSH access
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_PORT"
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_SSH_KNOWN_HOSTS"

          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/mifabot_deploy
          chmod 600 ~/.ssh/mifabot_deploy
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull, build, and restart MIFABOT
        if: inputs.diagnostics != true
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER"

          ssh \
            -i ~/.ssh/mifabot_deploy \
            -p "$VPS_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd /home/ubuntu/mifabot

          # SSH commands run non-interactively, so load NVM explicitly when
          # Node.js was installed through it on the VPS.
          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            . "$HOME/.nvm/nvm.sh"
          fi
          if ! command -v npm >/dev/null 2>&1; then
            echo "npm tidak ditemukan. Pastikan Node.js/NVM tersedia untuk user deployment VPS."
            exit 1
          fi

          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Deployment dibatalkan: ada perubahan lokal yang belum tercatat di VPS."
            git status --short
            exit 1
          fi

          git pull --ff-only origin main
          npm ci --include=dev
          npm run build
          pm2 restart mifabot --update-env
          pm2 save
          pm2 status mifabot
          REMOTE_SCRIPT

      - name: Diagnose MIFABOT runtime
        if: inputs.diagnostics == true
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/mifabot_deploy \
            -p "$VPS_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE_SCRIPT'
          set -euo pipefail
          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            . "$HOME/.nvm/nvm.sh"
          fi
          cd /home/ubuntu/mifabot
          echo "Commit: $(git rev-parse --short HEAD)"
          pm2 status mifabot
          pm2 describe mifabot

          auth_dir=$(sed -n 's/^[[:space:]]*BAILEYS_AUTH_DIR[[:space:]]*=[[:space:]]*//p' .env | tail -n 1 | tr -d '\r')
          if [ -z "$auth_dir" ]; then
            echo "Baileys session: konfigurasi tidak ditemukan"
          else
            case "$auth_dir" in
              ./*) auth_dir="$PWD/${auth_dir#./}" ;;
            esac
            if [ -d "$auth_dir" ] && [ -n "$(find "$auth_dir" -type f -print -quit)" ]; then
              echo "Baileys session: tersedia"
            else
              echo "Baileys session: tidak tersedia"
            fi
          fi

          last_connection_event=$( {
            tail -n 200 "$HOME/.pm2/logs/mifabot-out.log" 2>/dev/null || true
            tail -n 200 "$HOME/.pm2/logs/mifabot-error.log" 2>/dev/null || true
          } | grep -E 'MIFABOT tersambung ke WhatsApp|Scan QR berikut|Sesi WhatsApp keluar|Koneksi WhatsApp terputus|Gagal menyambung kembali|MIFABOT gagal dinyalakan' | tail -n 1 || true)
          case "$last_connection_event" in
            *"MIFABOT tersambung ke WhatsApp"*) echo "WhatsApp connection: tersambung" ;;
            *"Scan QR berikut"*) echo "WhatsApp connection: menunggu scan QR" ;;
            *"Sesi WhatsApp keluar"*) echo "WhatsApp connection: sesi keluar" ;;
            *"Koneksi WhatsApp terputus"*) echo "WhatsApp connection: terputus, mencoba menyambung" ;;
            *"Gagal menyambung kembali"*) echo "WhatsApp connection: gagal menyambung kembali" ;;
            *"MIFABOT gagal dinyalakan"*) echo "WhatsApp connection: startup gagal" ;;
            *) echo "WhatsApp connection: status belum terdeteksi" ;;
          esac
          disconnect_code=$(printf '%s' "$last_connection_event" | sed -n 's/.*"statusCode":\([0-9][0-9]*\).*/\1/p')
          if [ -n "$disconnect_code" ]; then
            echo "WhatsApp disconnect code: $disconnect_code"
          fi
          REMOTE_SCRIPT
