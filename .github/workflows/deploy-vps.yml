name: Deploy MIFABOT to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mifabot-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure VPS SSH access
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_PORT"
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_SSH_KNOWN_HOSTS"

          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/mifabot_deploy
          chmod 600 ~/.ssh/mifabot_deploy
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull, build, and restart MIFABOT
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER"

          ssh \
            -i ~/.ssh/mifabot_deploy \
            -p "$VPS_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd /home/ubuntu/mifabot

          # SSH commands run non-interactively, so load NVM explicitly when
          # Node.js was installed through it on the VPS.
          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            . "$HOME/.nvm/nvm.sh"
          fi
          if ! command -v npm >/dev/null 2>&1; then
            echo "npm tidak ditemukan. Pastikan Node.js/NVM tersedia untuk user deployment VPS."
            exit 1
          fi

          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Deployment dibatalkan: ada perubahan lokal yang belum tercatat di VPS."
            git status --short
            exit 1
          fi

          git pull --ff-only origin main
          npm ci --include=dev
          npm run build
          pm2 restart mifabot --update-env
          pm2 save
          pm2 status mifabot
          REMOTE_SCRIPT
